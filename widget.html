  function limpiarAlertas(x) {

    Object.keys(TIPOS_ALERTA).forEach(k => {
      const t = tx[k] && typeof tx[k] === 'object' ? tx[k] : {}, d = TIPOS_ALERTA[k];
      const sonido = t.sonido === undefined || t.sonido === 'incluido' ? 'incluido' : t.sonido === '' ? '' : archivoAlerta(t.sonido) || 'incluido';
      tipos[k] = {

    const pesos = FUENTES[nombre];

    if (!fuentesPedidas.has(nombre)) {

      const l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + nombre.replace(/ /g, '+') + ':wght@' + pesos + '&display=swap';

  // ---------- Posiciones ----------
  const azar = (a, b) => a + Math.random() * (b - a);
  const elegir = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function posicion(lugar, w, h) {
    const W = window.innerWidth, H = window.innerHeight, m = 30; // margen
    const libreX = Math.max(0, W - w - 2 * m), libreY = Math.max(0, H - h - 2 * m);
    let fx, fy;
    if (ZONAS[lugar]) {
      // Punto de la zona + un poco de variación para que no salga siempre igual
      [fx, fy] = ZONAS[lugar];
      fx = Math.min(1, Math.max(0, fx + azar(-0.08, 0.08)));
      fy = Math.min(1, Math.max(0, fy + azar(-0.08, 0.08)));

  // ---------- Quitar fondo verde ----------
  function chroma(video, canvas) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let vivo = true;
    const paso = () => {
      if (!vivo || video.ended) return;
      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height), d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i], g = d[i + 1], b = d[i + 2];
          const exceso = g - Math.max(r, b);          // cuánto "más verde" es
          if (exceso > 60) d[i + 3] = 0;
          else if (exceso > 25) { d[i + 3] = 255 * (60 - exceso) / 35; d[i + 1] = Math.max(r, b); }
        }
        ctx.putImageData(img, 0, 0);
      } catch (e) { // si el navegador no deja leer el video, se muestra tal cual
        vivo = false; canvas.replaceWith(video); return;
      }
      video.requestVideoFrameCallback ? video.requestVideoFrameCallback(paso) : requestAnimationFrame(paso);
    };
    paso();
    return () => { vivo = false; };

    const paso = () => {

      }
      const a = new Audio(); a.volume = T.volumen; sonando.push(a);
      const [tl, dom] = VOCES[v.voz] || VOCES[T.idioma] || VOCES.es;
      // Si el dominio del acento no responde, se prueba con translate.google.com (misma voz, acento estándar)
      const formas = [[dom, 'tw-ob'], ['com', 'tw-ob'], ['com', 'gtx']].filter((f, i, l) => l.findIndex(g => g[0] === f[0] && g[1] === f[1]) === i)
        .filter(f => !vocesRotas.has(f.join('|')));

  const ultimoTTS = new Map();     // usuario -> momento del último !tts
  function decir(texto, usuario, sinEspera, voz, efecto) {

      .split(/\s+/).filter(p => p && !emotes.has(p)).join(' ')   // no lee los emotes de 7TV
      .trim();

    if (!texto) return;

    if (!T.activa || !T.comando) return false;
    const t = String(texto || '').trim();
    if (t.toLowerCase() !== T.comando && !t.toLowerCase().startsWith(T.comando + ' ')) return false;

    for (let i = 0; i < 2 && T.vocesChat; i++) {

  function rolIRC(tags) {

    if (/(^|,)vip\//.test(b) || tags.vip === '1') return 2;

  // =====================================================================

  // =====================================================================
  const emotes = new Map();          // nombre -> url de la imagen

  function url7tv(e) {
    const host = (e.data && e.data.host) || {};
    const base = host.url ? 'https:' + host.url.replace(/^https?:/, '') : 'https://cdn.7tv.app/emote/' + e.id;
    const files = Array.isArray(host.files) ? host.files.map(f => f.name) : [];
    const archivo = ['2x.webp', '3x.webp', '1x.webp', '2x.gif', '2x.png'].find(f => files.includes(f)) || '2x.webp';
    return urlSegura(base + '/' + archivo);

  async function cargarEmotes(twitchId) {
    if (!twitchId) return;
    const pedir = (u) => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
    const [usuario, global] = await Promise.all([
      pedir('https://7tv.io/v3/users/twitch/' + encodeURIComponent(twitchId)),
      L.globales ? pedir('https://7tv.io/v3/emote-sets/global') : null,
    ]);
    const nuevos = new Map();
    const sumar = (set) => (set && Array.isArray(set.emotes) ? set.emotes : []).forEach(e => {
      const n = String(e.name || '').slice(0, 100), u = url7tv(e);
      if (n && u) nuevos.set(n, u);
    });
    sumar(global); sumar(usuario && usuario.emote_set);   // los del canal pisan a los globales
    emotes.clear(); nuevos.forEach((u, n) => emotes.set(n, u));
    emotesDe = twitchId; ultimaCarga = Date.now();

    if (!L.activa || typeof texto !== 'string') return;
    const ahora = Date.now(), enEste = new Map();
    texto.split(/\s+/).forEach(p => { if (emotes.has(p)) enEste.set(p, emotes.get(p)); });
    if (L.twitch && twitchEmotes) twitchEmotes.forEach((u, n) => enEste.set(n, u));
    // cada mensaje cuenta una sola vez por emote (si alguien pone "KEKW KEKW KEKW" cuenta 1)
    enEste.forEach((url, nombre) => {
      const t = (vistos.get(nombre) || []).filter(x => ahora - x < L.ventana * 1000);
      t.push(ahora); vistos.set(nombre, t);
      if (t.length >= L.umbral && ahora - ultimaLluvia >= L.cooldown * 1000) {
        ultimaLluvia = ahora; vistos.clear();
        lluvia(url, nombre);
      }

  // --- La lluvia ---
  let gotas = 0;
  function lluvia(url, nombre) {
    url = urlSegura(url); if (!url) return;

    const pre = new Image();
    pre.onload = () => {

      for (let i = 0; i < L.cantidad && gotas < 400; i++) {

        const espera = Math.random() * Math.max(0, dur - caida);

          { transform: 'translate(0,' + -alto + 'px) rotate(' + -giro + 'deg)' },
          { transform: 'translate(' + deriva + 'px,' + (H + alto) + 'px) rotate(' + giro + 'deg)' },
        ], { duration: caida, delay: espera, easing: 'cubic-bezier(.45,.05,.75,.6)', fill: 'both' });
        a.onfinish = () => { g.remove(); gotas--; };

  function probarLluvia(nombre, url) {
    nombre = String(nombre || '').slice(0, 100);
    const u = emotes.get(nombre) || urlSegura(url) || (emotes.size ? [...emotes.values()][0] : '');

  }
  window.probarLluvia = probarLluvia;

  // --- Chat de Twitch: conexión anónima (solo lee, no escribe ni pide contraseña) ---
  let irc = null, ircCanal = '', ircListo = false, canalSB = '', ircReintento;
  function chatIniciar() {
    clearTimeout(ircReintento);
    const canal = L.canal || canalSB;
    if (irc) { irc.onclose = null; irc.close(); irc = null; ircListo = false; }
    if (!L.activa && !T.activa) return;
    if (!canal) { pedirCanalASB(); return; }       // todavía no sé el canal: se lo pido a Streamer.bot
    ircCanal = canal;
    let ws;
    try { ws = irc = new WebSocket('wss://irc-ws.chat.twitch.tv:443'); } catch { ircReintento = setTimeout(chatIniciar, 10000); return; }
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
      ws.send('JOIN #' + canal);
    };
    ws.onmessage = (ev) => String(ev.data).split('\r\n').forEach(linea => {
      if (!linea) return;
      if (linea.startsWith('PING')) { ws.send('PONG' + linea.slice(4)); return; }
      let tags = {}, resto = linea;
      if (linea[0] === '@') {
        const i = linea.indexOf(' ');
        linea.slice(1, i).split(';').forEach(kv => { const j = kv.indexOf('='); tags[kv.slice(0, j)] = kv.slice(j + 1); });
        resto = linea.slice(i + 1);
      }
      const m = resto.match(/^:\S+ (\S+) #\S+(?: :(.*))?$/);
      if (!m) return;
      if (m[1] === 'ROOMSTATE' && tags['room-id']) {
        if (!ircListo) { ircListo = true; log('Leyendo el chat de ' + canal); }
        if (tags['room-id'] !== emotesDe || Date.now() - ultimaCarga > 10 * 60000) cargarEmotes(tags['room-id']);
      } else if (m[1] === 'PRIVMSG') {
        const texto = m[2] || '';
        let tw = null;
        if (L.twitch && tags.emotes) {    // emotes propios de Twitch: "25:0-4,6-10/1902:12-16"
          tw = new Map(); const letras = Array.from(texto);
          tags.emotes.split('/').forEach(par => {
            const [id, pos] = par.split(':'); if (!/^[\w-]+$/.test(id) || !pos) return;
            const [a, b] = pos.split(',')[0].split('-').map(Number);
            tw.set(letras.slice(a, b + 1).join(''), 'https://static-cdn.jtvnw.net/emoticons/v2/' + id + '/default/dark/2.0');
          });
        }
        const quien = tags['display-name'] || (resto.match(/^:(\w+)!/) || [])[1] || '';
        if (comandoTTS(texto, quien, rolIRC(tags))) return;
        mensajeDeChat(texto, tw);
      }
    });
    ws.onclose = () => { ircListo = false; if (irc === ws) ircReintento = setTimeout(chatIniciar, 5000); };
  }
  function pedirCanalASB() {
    if (wsActual && wsActual.readyState === 1) wsActual.send(JSON.stringify({ request: 'GetBroadcaster', id: 'canal' }));
  }
  // Volver a pedir los emotes cada 10 minutos (por si agregaste emotes nuevos en 7TV)
  setInterval(() => { if (emotesDe && Date.now() - ultimaCarga > 10 * 60000) cargarEmotes(emotesDe); }, 60000);


  // =====================================================================
  //  Alertas: seguidores, subs, subs regaladas, bits, raids y donaciones
  //  Tienen su propia fila (salen de a una y nunca se descartan por las
  //  recompensas). Mientras hay una alerta, las recompensas esperan su turno.
  // =====================================================================
  const colaAlertas = [];
  let alertaViva = false;
  const recientes = new Map();       // para no mostrar dos veces el mismo evento
  const textoLimpio = (t, n) => String(t == null ? '' : t).replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, n);
  const primero = (...xs) => xs.find(x => x !== undefined && x !== null && x !== '' && typeof x !== 'object');
  function nivelSub(d) {
    if (d.isPrime === true || d.is_prime === true) return 'Prime';
    const t = String(primero(d.subTier, d.tier, d.sub_tier, d.subPlan, d.sub_plan) ?? '1').toLowerCase();
    if (t.includes('prime')) return 'Prime';
    const n = parseInt(t.replace(/\D/g, ''), 10);
    return n >= 1000 ? String(Math.round(n / 1000)) : n >= 1 && n <= 3 ? String(n) : '1';
  }
  // Streamer.bot cambió los nombres de los datos entre versiones: se prueban todos.
  function datosDeEvento(tipo, d) {
    d = d && typeof d === 'object' ? d : {};
    const u = d.user && typeof d.user === 'object' ? d.user : {};
    const m = d.message && typeof d.message === 'object' ? d.message : {};
    const anonimo = d.anonymous === true || d.isAnonymous === true || d.is_anonymous === true || m.isAnonymous === true;
    const usuario = anonimo ? 'Anónimo' : textoLimpio(primero(u.name, u.display_name, u.displayName, d.displayName, d.display_name, d.user_name, d.userName,
      m.displayName, m.username, d.username, d.from, d.from_broadcaster_user_name, d.fromBroadcasterUserName, d.name,
      typeof d.user === 'string' ? d.user : undefined, u.login, d.user_login) || 'Alguien', 40);
    const mensaje = textoLimpio(primero(typeof d.message === 'string' ? d.message : undefined, m.message, m.text, d.text, d.messageText), 300);
    const x = { usuario, mensaje: tipo === 'bits' ? textoLimpio(mensaje.replace(/\b[a-z]+\d+\b/gi, ' '), 300) : mensaje, nivel: nivelSub(d) };
    if (tipo === 'bits') x.cantidad = Number(primero(d.bits, m.bits, d.amount)) || 0;
    if (tipo === 'raid') x.cantidad = Number(primero(d.viewers, d.viewerCount, d.viewer_count, d.raiders)) || 0;
    if (tipo === 'bomba') x.cantidad = Number(primero(d.gifts, d.total, d.count, d.amount)) || 1;
    if (tipo === 'resub') x.meses = x.cantidad = Number(primero(d.cumulativeMonths, d.cumulative_months, d.cumulative, d.months, d.totalMonths)) || 1;
    if (tipo === 'regalo') {
      const r = d.recipient && typeof d.recipient === 'object' ? d.recipient : {};
      x.destino = textoLimpio(primero(r.name, r.display_name, r.displayName, d.recipientDisplayName, d.recipientUserName, d.recipientUsername, d.recipient_user_name, r.login) || 'alguien', 40);
    }
    if (tipo === 'donacion') {
      const monto = Number(primero(d.amount, d.donationAmount, d.value)) || 0;
      x.monto = monto;
      x.cantidad = textoLimpio(primero(d.formattedAmount, d.formatted_amount, d.amountFormatted) || (monto ? monto + ' ' + textoLimpio(primero(d.currency, d.currencyCode) || '', 5) : ''), 20).trim();
    }
    return x;
  }
  function alerta(tipo, datos, esPrueba) {
    if (!A.activa && !esPrueba) return;
    const tc = A.tipos[tipo];
    if (!tc || (!tc.activa && !esPrueba)) { if (esPrueba) log('Esa alerta está desactivada'); return; }
    if (!esPrueba && TIPOS_ALERTA[tipo].min) {
      const n = tipo === 'donacion' ? datos.monto : Number(datos.cantidad);
      if (n < tc.minimo) { log('Alerta de ' + TIPOS_ALERTA[tipo].nombre + ' (' + datos.cantidad + ') no llega al mínimo'); return; }
    }
    const clave = tipo + '|' + datos.usuario + '|' + (datos.cantidad || '') + '|' + (datos.destino || '');
    if (!esPrueba && Date.now() - (recientes.get(clave) || 0) < 4000) return;
    recientes.set(clave, Date.now());
    if (recientes.size > 200) recientes.clear();
    if (colaAlertas.length >= 50) { log('Hay 50 alertas esperando: esta no entra'); return; }
    colaAlertas.push({ tipo, datos });
    if (!alertaViva) siguienteAlerta();
  }
  function siguienteAlerta() {
    const x = colaAlertas.shift();
    if (!x) { alertaViva = false; drenarCola(); return; }
    alertaViva = true;
    mostrarAlerta(x.tipo, x.datos, () => setTimeout(siguienteAlerta, 500));
  }
  function mostrarAlerta(tipo, datos, listo) {
    const E = A.estilo, tc = A.tipos[tipo], k = window.innerWidth / 1920, ruta = (a) => 'alertas/' + encodeURIComponent(a);
    log('Alerta: ' + TIPOS_ALERTA[tipo].nombre + ' de ' + datos.usuario + (datos.cantidad ? ' (' + datos.cantidad + ')' : ''));
    const tipoArch = tc.archivo ? tipoDe(tc.archivo) : '';
    // 1) Cargar la imagen o el video (si no carga en 4 s, la alerta sale sin él)
    const media = new Promise(ok => {
      if (!tc.archivo || tipoArch === 'audio') { ok(null); return; }
      const t = setTimeout(() => ok(null), 4000);
      const fallo = () => { clearTimeout(t); log('No encuentro alertas/' + tc.archivo); ok(null); };
      if (tipoArch === 'imagen') {
        const i = new Image(); i.onload = () => { clearTimeout(t); ok(i); }; i.onerror = fallo; i.src = ruta(tc.archivo);
      } else {
        const v = document.createElement('video'); v.playsInline = true; v.volume = tc.volumen; v.preload = 'auto';
        v.addEventListener('loadeddata', () => { clearTimeout(t); ok(v); }, { once: true }); v.addEventListener('error', fallo, { once: true });
        v.src = ruta(tc.archivo);
      }
    });
    Promise.all([media, cargarFuente(E.fuente)]).then(([m]) => {
      const el = armarAlerta(E, tc, datos, m, k);
      el.style.visibility = 'hidden'; document.body.appendChild(el);
      ponerAlerta(el, E, window.innerWidth, window.innerHeight, k);
      el.style.visibility = '';
      animarAlerta(el, E, k, false);
      const sonando = [];
      let fin = false, tFin;
      const tocar = (x) => x.play().catch(() => { x.muted = true; x.play().catch(() => {}); });
      const terminar = () => {
        if (fin) return; fin = true; clearTimeout(tFin);
        sonando.filter(x => !x.paused && !x.ended).forEach(x => apagarDeAPoco(x, 400, () => x.pause()));
        animarAlerta(el, E, k, true).onfinish = () => {
          el.remove(); sonando.forEach(x => { x.pause(); x.removeAttribute('src'); });
          listo();
          if (tc.leer && datos.mensaje) decir(datos.mensaje, datos.usuario, true);
        };
      };
      // 2) Sonido: la campanita incluida, un audio propio, o el sonido del video
      if (m && m.tagName === 'VIDEO') { sonando.push(m); m.loop = tc.duracion > 0; tocar(m); if (!(tc.duracion > 0)) m.addEventListener('ended', terminar); }
      if (tc.sonido === 'incluido') campanita(tipo, tc.volumen);
      else if (tc.sonido) {
        const s = new Audio(ruta(tc.sonido)); s.volume = tc.volumen; sonando.push(s);
        s.addEventListener('error', () => log('No encuentro el sonido alertas/' + tc.sonido));
        if (!(tc.duracion > 0) && !(m && m.tagName === 'VIDEO')) s.addEventListener('ended', terminar);
        tocar(s);
      }
      if (tipoArch === 'audio') {   // un audio elegido como "imagen o video" se usa como sonido
        const s = new Audio(ruta(tc.archivo)); s.volume = tc.volumen; sonando.push(s); tocar(s);
      }
      // 3) Duración: los segundos elegidos, o (en 0) lo que dure el video o el sonido, máximo 60 s
      const enCero = (m && m.tagName === 'VIDEO') || (tc.sonido && tc.sonido !== 'incluido');
      tFin = setTimeout(terminar, (tc.duracion > 0 ? tc.duracion : enCero ? 60 : 6) * 1000);
    });
  }
  function probarAlerta(tipo) {
    if (!TIPOS_ALERTA[tipo]) tipo = 'follow';
    alerta(tipo, Object.assign({ monto: 5 }, PRUEBA_ALERTA[tipo]), true);
  }
  window.probarAlerta = probarAlerta;
  const EVENTOS_ALERTA = { Follow: 'follow', Sub: 'sub', ReSub: 'resub', GiftSub: 'regalo', GiftBomb: 'bomba', Cheer: 'bits', Raid: 'raid' };
  // Donaciones: llegan por Streamer.bot desde StreamElements, Streamlabs, Ko-fi o TipeeeStream
  const EVENTOS_DONACION = { StreamElements: 'Tip', Streamlabs: 'Donation', Kofi: 'Donation', TipeeeStream: 'Donation' };
  function eventoDeAlerta(src, type, d) {
    let tipo = '';
    if (src === 'Twitch' && EVENTOS_ALERTA[type]) tipo = EVENTOS_ALERTA[type];
    else if (EVENTOS_DONACION[src] === type) tipo = 'donacion';
    if (!tipo) return false;
    d = d && typeof d === 'object' ? d : {};
    // Las subs de una "lluvia de regalos" no salen de a una: sale la alerta de varias regaladas
    if (tipo === 'regalo' && (d.fromSubBomb === true || d.fromCommunitySubGift === true || d.from_community_sub_gift === true || d.isFromCommunityGift === true)) return true;
    alerta(tipo, datosDeEvento(tipo, d));
    return true;
  }

  // ---------- Conexión con Streamer.bot ----------
  async function sha256b64(texto) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }

  let wsActual = null;
  function conectar() {
    const url = 'ws://' + (C.streamerbotHost || '127.0.0.1') + ':' + (C.streamerbotPuerto || 8080) + '/';
    log('Conectando a Streamer.bot (' + url + ')…');
    let ws;
    try { ws = wsActual = new WebSocket(url); } catch (e) { setTimeout(conectar, 5000); return; }
    const suscribir = () => {
      ws.send(JSON.stringify({ request: 'Subscribe', id: 'recompensas', events: { Twitch: ['RewardRedemption', 'ChatMessage'] } }));
      // Alertas y donaciones van en pedidos aparte: si alguno falla, las recompensas siguen andando
      ws.send(JSON.stringify({ request: 'Subscribe', id: 'alertas', events: { Twitch: Object.keys(EVENTOS_ALERTA) } }));
      Object.keys(EVENTOS_DONACION).forEach(src => ws.send(JSON.stringify({ request: 'Subscribe', id: 'donaciones-' + src, events: { [src]: [EVENTOS_DONACION[src]] } })));
      if (!L.canal) pedirCanalASB();
    };

    ws.onmessage = async (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.request === 'Hello') {
        if (msg.authentication) {
          const { salt, challenge } = msg.authentication;
          const secreto = await sha256b64((C.streamerbotClave || '') + salt);
          ws.send(JSON.stringify({ request: 'Authenticate', id: 'auth', authentication: await sha256b64(secreto + challenge) }));
        } else suscribir();
        return;
      }
      if (msg.id === 'auth') {
        if (msg.status === 'ok') suscribir();
        else log('Streamer.bot rechazó la clave. Revisa streamerbotClave en config.js');
        return;
      }
      if (msg.id === 'recompensas') { window.__sinConexion = false; log('Conectado a Streamer.bot. Esperando canjes…'); return; }
      if (msg.id === 'canal') {
        const tw = msg.platforms && msg.platforms.twitch;
        const c = String((tw && (tw.broadcastUserName || tw.broadcastUser)) || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
        if (c && c !== canalSB) { canalSB = c; if (!L.canal) chatIniciar(); }
        return;
      }
      if (msg.event && eventoDeAlerta(msg.event.source, msg.event.type, msg.data)) return;
      if (msg.event && msg.event.source === 'Twitch' && msg.event.type === 'RewardRedemption') {
        const d = msg.data || {};
        const titulo = (d.reward && d.reward.title) || d.rewardTitle || d.title;
        canje(titulo, d.user_name || d.userName || d.user, d.user_input || d.userInput || d.input || d.rawInput);
      }
      // Si el chat anónimo no conecta, se usa el chat que manda Streamer.bot
      if (msg.event && msg.event.source === 'Twitch' && msg.event.type === 'ChatMessage' && !ircListo) {
        const d = msg.data || {};
        const m = d.message && typeof d.message === 'object' ? d.message : {};
        const texto = d.message && typeof d.message === 'object' ? m.message : (typeof d.message === 'string' ? d.message : d.text);
        const u = d.user || {};
        const r = Number(m.role || u.role || 0);   // Streamer.bot: 1 viewer, 2 vip, 3 mod, 4 dueño
        const rol = r >= 4 ? 4 : r === 3 ? 3 : r === 2 ? 2 : (m.subscriber || u.subscribed) ? 1 : 0;
        if (comandoTTS(String(texto || ''), m.displayName || m.username || u.name || u.login || '', rol)) return;
        mensajeDeChat(String(texto || ''), null);
      }
    };
    ws.onclose = () => {
      // Solo avisa la primera vez, para no tapar la pantalla cada 5 s si Streamer.bot está cerrado
      if (!window.__sinConexion) log('Sin conexión con Streamer.bot (' + url + '). ¿Está encendido su WebSocket Server? Reintentando…');
      window.__sinConexion = true; setTimeout(conectar, 5000);
    };
  }

  conectar();
  chatIniciar();

  if (params.get('alerta')) setTimeout(() => probarAlerta(params.get('alerta')), 800);
  // Pruebas: widget.html?probar=duckdance  o, en OBS > "Interactuar", teclas 1-9
  if (params.get('probar')) setTimeout(() => probar(params.get('probar')), 800);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') { document.body.classList.toggle('debug'); return; }
    if (e.key === 'p' || e.key === 'P') { log('Prueba: tecla P'); probar(); return; }
    if (e.key === 'l' || e.key === 'L') { probarLluvia(); return; }
    if (e.key === 'a' || e.key === 'A') { const t = Object.keys(TIPOS_ALERTA); probarAlerta(t[Math.floor(Math.random() * t.length)]); return; }
    if (e.key === 't' || e.key === 'T') { decir('Hola, esto es una prueba de voz', 'prueba', true); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && lista[n - 1]) probar(lista[n - 1].nombre);
  });
})();
</script>
</body>
